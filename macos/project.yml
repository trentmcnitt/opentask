name: OpenTaskMac

# Native macOS companion app. This is NOT a Mac Catalyst build of ios/ — it is a
# separate, small AppKit/SwiftUI app that hosts the same PWA in a macOS WKWebView.
# It deliberately lives in its own spec so `ios/project.yml` (iPhone + watch +
# two extensions) is never touched by Mac work. See macos/README.md.

options:
  bundleIdPrefix: io.mcnitt
  deploymentTarget:
    # 14.0: @Observable (Observation) needs it, and the widget extension that may
    # follow sets the same floor for interactive AppIntent buttons.
    macOS: '14.0'

settings:
  base:
    DEVELOPMENT_TEAM: GEL3VGTUJX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.9'

targets:
  OpenTaskMac:
    type: application
    platform: macOS
    sources:
      - path: OpenTaskMac
        excludes:
          - '*.entitlements'
      # Reused verbatim from the iPhone app. These five files are platform-
      # agnostic Foundation/UserNotifications code and compile unchanged on
      # macOS; KeychainHelper carries the only macOS-aware branch.
      - path: ../ios/Shared
      # Not in Shared/ because Shared/ is compiled into the watchOS target too
      # and WebKit does not exist on watchOS. Referenced by file instead of
      # copied: it encodes the /api/auth/session-from-token contract, and two
      # copies of that would drift. Foundation + WebKit only.
      - path: ../ios/OpenTask/SessionBootstrapper.swift
    info:
      path: OpenTaskMac/Info.plist
      properties:
        CFBundleName: OpenTask
        CFBundleDisplayName: OpenTask
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ''
        # Local-loopback exception only (http://localhost), same as the iPhone
        # app: lets a dev server reached through an SSH tunnel load. Does NOT
        # weaken ATS for any remote host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: OpenTaskMac/OpenTaskMac.entitlements
      properties:
        # Sandboxed on purpose: an unsandboxed macOS app extension is a
        # plausible silent non-load, and a notification content extension may
        # follow. network.client is what lets a sandboxed app reach the server
        # at all — without it both WKWebView and URLSession fail.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        #
        # App Group, shared with OpenTaskMacWidgets so the widget extension's
        # timeline providers can read the same Keychain-stored credentials and
        # WidgetStore cache the app writes. macOS App Group IDs need the
        # team-ID prefix — unlike iOS's bare `group.io.mcnitt.opentask` — per
        # Apple's docs on `kSecAttrAccessGroup`. Confirmed working empirically
        # (2026-09-22): `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)`
        # resolves to a real, existing path and a `UserDefaults(suiteName:)`
        # round-trip succeeds, even though the embedded "Mac Team Provisioning
        # Profile" this team's automatic signing generates does not list
        # `com.apple.security.application-groups` when its Entitlements dict is
        # dumped directly (`security cms -D` on `embedded.provisionprofile`).
        # That dict is not the full picture for an auto-managed profile — trust
        # the runtime check (this one, or `codesign -d --entitlements -` on the
        # built app), not the profile's own entitlement listing.
        com.apple.security.application-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        #
        # `keychain-access-groups`, explicit and required alongside the App Group
        # above. Before `com.apple.security.application-groups` existed on this
        # App ID, automatic signing silently synthesized a wildcard
        # (`keychain-access-groups: [GEL3VGTUJX.*]`) into every build, which is
        # why sharing the Bearer token worked without this key ever being
        # written down. Requesting an explicit App Group made Xcode stop
        # synthesizing that wildcard — the signed binary quietly lost
        # `keychain-access-groups` entirely and every `SecItemAdd`/
        # `SecItemCopyMatching` call using `kSecAttrAccessGroup` started failing
        # with errSecMissingEntitlement (-34018), even though
        # `com.apple.security.application-groups` itself kept working fine
        # (confirmed via `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)`).
        # On iOS the App Group alone is sufficient for keychain access-group
        # matching; on macOS it is not — verified empirically (2026-09-22) by
        # adding this key back explicitly and watching the same seed-credential
        # save go from -34018 to success.
        # NOTE: bare key, no `com.apple.security.` prefix — matches what the
        # provisioning profile itself uses (verified via `security cms -D` on
        # the embedded profile before this was added).
        keychain-access-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        #
        # `aps-environment` is deliberately NOT here (see OpenTaskMac-Push.entitlements
        # for the push variant). Historical note: this used to be blocked on a
        # signed-out Apple ID and no macOS profile existing at all — both are
        # resolved now (automatic signing fetches a real "Mac Team Provisioning
        # Profile" for this App ID without issue as of 2026-09-22), but the
        # split is kept because XcodeGen still needs one entitlements file it
        # owns and one hand-written variant for CODE_SIGN_ENTITLEMENTS overrides.
        #
        #   xcodebuild ... CODE_SIGN_ENTITLEMENTS=OpenTaskMac/OpenTaskMac-Push.entitlements \
        #     -allowProvisioningUpdates
        #
        # Without it the app runs normally and APNs registration fails loudly
        # in the log (see MacAppDelegate.didFailToRegisterForRemoteNotifications).
    dependencies:
      - target: OpenTaskMacWidgets
    settings:
      base:
        # The SAME bundle ID as the iPhone app (2026-09-23). With its own
        # (`io.mcnitt.opentask.mac`) macOS treated the Mac app and the iPhone
        # app as two unrelated apps, so the widget gallery listed "OpenTask"
        # twice — Trent: "usually when they share the same information,
        # there's only one app and when I click it, it says 'from iPhone' or
        # 'from Mac'." One ID across platforms is Apple's model for one app.
        # The App Group (team-prefixed on macOS) and Keychain group are
        # unchanged, so signed-in state and cached widget data carry over.
        PRODUCT_BUNDLE_IDENTIFIER: io.mcnitt.opentask
        # `PRODUCT_NAME` (defaults to the target name, "OpenTaskMac") is what
        # actually names the .app FILE — Finder, Spotlight and Launchpad show
        # the file name, not `CFBundleDisplayName` (already "OpenTask" above).
        # `EXECUTABLE_NAME` and the wrapper extension both derive from
        # `PRODUCT_NAME` too, so this also renames the binary inside the
        # bundle to `OpenTask.app/Contents/MacOS/OpenTask`. Target name,
        # scheme names, bundle IDs, entitlements and the App Group are all
        # keyed off the TARGET name ("OpenTaskMac") or explicit settings
        # above/below, not `PRODUCT_NAME`, so none of them move.
        PRODUCT_NAME: OpenTask
        # `PRODUCT_MODULE_NAME` defaults to `$(PRODUCT_NAME:c99extidentifier)`
        # — without this it would silently follow `PRODUCT_NAME` above and
        # the Swift module would become "OpenTask" instead of "OpenTaskMac".
        # Nothing in this codebase currently imports that module name or
        # references it by string, but pinning it is the least-disruptive
        # choice: it keeps the module identity stable across this rename
        # (derived data, module cache, any future `@testable import
        # OpenTaskMac` all keep working) while only the FILE users see
        # changes.
        PRODUCT_MODULE_NAME: OpenTaskMac
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
        # AppIcon (OpenTaskMac/Assets.xcassets/AppIcon.appiconset) is derived from
        # ios/OpenTask/Assets.xcassets/AppIcon.appiconset/icon-1024.png — the only
        # 1024x1024 clean export available (assets/ and public/ only have the
        # 548x548 logomark and the 1260x232 wordmark). That iOS source is a
        # full-bleed square with no padding, which is the iOS convention, not the
        # macOS one. To make a macOS-shaped icon: scaled the source to 824x824
        # (~80.5%, matching Apple's Big Sur icon template), masked it with an
        # n=5 superellipse ("squircle"), and centered it on a transparent
        # 1024x1024 canvas. No artwork was redrawn or added — this only pads and
        # masks the existing logo. Regenerate the same way if the iOS art changes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Native macOS WidgetKit extension — porting ios/OpenTaskWidgets/, not sharing
  # a binary with it. WidgetKit has NO Mac Catalyst slice at all (verified from
  # the SDK), so this has to be a genuinely native macOS app-extension target
  # regardless of what hosts it. The three widget kinds (Reminders, Tasks,
  # Track), their timeline providers, WidgetStore caching, TaskFeed sharing and
  # ChevronPager are all reused unmodified from ios/OpenTaskWidgets/ — only
  # WidgetTheme.swift's UIKit line-height call and the six
  # `.accessoryRectangular`/`.accessoryCircular` call sites (hard compile
  # errors on native macOS, unlike the Designed-for-iPad build) needed
  # `#if os(iOS)` branching, done in place so ios/'s own build is untouched.
  OpenTaskMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: OpenTaskMacWidgets
        excludes:
          - '*.entitlements'
          - Info.plist
      # The whole widget extension, reused unmodified except for the platform
      # guards described above. Referenced by path, not copied, so a future
      # change to reminder/task/track behavior only has to happen once.
      - path: ../ios/OpenTaskWidgets
      # Same five files OpenTaskMac reuses (APIClient, KeychainHelper,
      # DateHelpers, OpenTaskModels, NotificationConstants) — the widget
      # extension is a second, separate process and needs its own copy of the
      # code that reads the shared Keychain credentials, not a reference to
      # the app's.
      - path: ../ios/Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: OpenTaskMacWidgets/OpenTaskMacWidgets.entitlements
      properties:
        # Same sandbox + App Group + keychain-access-groups triple as
        # OpenTaskMac, and for the same reasons — see the long comment on that
        # target's entitlements. A widget extension is its own process; it
        # needs its own grant of both entitlements to read the App Group cache
        # AND the Keychain-stored Bearer token the app saves, not just to be
        # embedded in an app that has them.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        keychain-access-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        # WidgetKit push (macOS 26 — see ../ios/OpenTaskWidgets/WidgetPushHandler.swift,
        # shared into this target above). Apple's docs: "Add the capability to
        # use remote push notifications to your widget extension target" —
        # this is that capability. macOS spells it with the
        # `com.apple.developer.` prefix (iOS uses the bare `aps-environment`)
        # — see the long comment in OpenTaskMac/OpenTaskMac-Push.entitlements:
        # a Mac provisioning profile only grants the prefixed form, and Xcode
        # silently DROPS any entitlement key the profile doesn't grant, with
        # no build error. Confirmed empirically here too: the bare key signed
        # and built cleanly while silently missing from the signed binary
        # (`codesign -d --entitlements -`) until switched to the prefixed key.
        com.apple.developer.aps-environment: development
    settings:
      base:
        # The iPhone widget extension's ID, for the same reason as the app's.
        PRODUCT_BUNDLE_IDENTIFIER: io.mcnitt.opentask.widgets
        SWIFT_VERSION: '5.9'
        INFOPLIST_FILE: OpenTaskMacWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false

  # Unit tests for the native clients' pure logic (testing pass WP5,
  # 2026-09-25) — a hostless macOS test bundle, so it runs without a
  # simulator or a signed-in device:
  #
  #   cd macos && xcodegen generate && \
  #     xcodebuild test -scheme OpenTaskLogicTests -destination 'platform=macOS'
  #
  # It compiles the SAME source files the phone/watch/Mac targets do (by
  # path, never copies): ios/Shared, the widget extension's WidgetStore and
  # TasksTimeline (the Tasks widget's lists and scope ring/default) and
  # DueLabel (its due-label words), and the
  # watch's two pure-logic files. All Foundation-only. Left out:
  #   - NotificationConstants.swift — UserNotifications registration, no
  #     logic worth testing, and it would pull the framework into the bundle.
  #   - everything else in OpenTaskWidgets/WatchShared (SwiftUI/WidgetKit).
  # KeychainHelper stays in: APIClient calls it and TaskSnoozePlan calls
  # APIClient, and nothing touches either at load. No test calls the network
  # or the Keychain.
  #
  # WidgetStore's only non-Foundation references are two widget kind
  # strings; ios/Tests/Logic/Support/WidgetKindShims.swift stands in for
  # them. And WidgetStore.suiteOverride (DEBUG-only) keeps every test off the
  # real App Group suite, which on this Mac is the installed app's widget
  # cache.
  #
  # Resources: the server contract fixtures (tests/fixtures/contract/*.json),
  # written by tests/integration/contract-fixtures.test.ts.
  OpenTaskLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../ios/Shared
        excludes:
          - NotificationConstants.swift
      - path: ../ios/OpenTaskWidgets/WidgetStore.swift
      - path: ../ios/OpenTaskWidgets/TasksTimeline.swift
      - path: ../ios/OpenTaskWidgets/DueLabel.swift
      - path: ../ios/WatchShared/WatchQuotaLogic.swift
      - path: ../ios/WatchShared/WatchSlotLogic.swift
      - path: ../ios/Tests/Logic
      - path: ../tests/fixtures/contract
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mcnitt.opentask.logictests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.9'

# Shared schemes, generated rather than left to Xcode's autocreation.
#
# Without these, XcodeGen emits no scheme at all and Xcode silently
# autocreates only whichever target it feels like — in practice just the
# widget extension, which is why the app could be built from the command line
# (`xcodebuild -scheme OpenTaskMac` resolves a target directly) while Xcode's
# own scheme menu offered no way to RUN the app. A real Run does installation
# and registration work a command-line build does not, so not being able to
# reach it from the UI is a genuine blocker, not a cosmetic one.
schemes:
  OpenTaskMac:
    build:
      targets:
        OpenTaskMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  OpenTaskMacWidgets:
    build:
      targets:
        OpenTaskMacWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  # The static WidgetStore.suiteOverride is one process-wide seam, so test
  # classes must not run in parallel against it.
  OpenTaskLogicTests:
    build:
      targets:
        OpenTaskLogicTests: [test]
    test:
      config: Debug
      targets:
        - name: OpenTaskLogicTests
          parallelizable: false
