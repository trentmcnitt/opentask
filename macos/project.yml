name: OpenTaskMac

# Native macOS companion app. This is NOT a Mac Catalyst build of ios/ — it is a
# separate, small AppKit/SwiftUI app that hosts the same PWA in a macOS WKWebView.
# It deliberately lives in its own spec so `ios/project.yml` (iPhone + watch +
# two extensions) is never touched by Mac work. See macos/README.md.

options:
  bundleIdPrefix: io.mcnitt
  deploymentTarget:
    # 14.0: @Observable (Observation) needs it, and the widget extension that may
    # follow sets the same floor for interactive AppIntent buttons.
    macOS: '14.0'

settings:
  base:
    DEVELOPMENT_TEAM: GEL3VGTUJX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.9'

targets:
  OpenTaskMac:
    type: application
    platform: macOS
    sources:
      - path: OpenTaskMac
        excludes:
          - '*.entitlements'
      # Reused verbatim from the iPhone app. These five files are platform-
      # agnostic Foundation/UserNotifications code and compile unchanged on
      # macOS; KeychainHelper carries the only macOS-aware branch.
      - path: ../ios/Shared
      # Not in Shared/ because Shared/ is compiled into the watchOS target too
      # and WebKit does not exist on watchOS. Referenced by file instead of
      # copied: it encodes the /api/auth/session-from-token contract, and two
      # copies of that would drift. Foundation + WebKit only.
      - path: ../ios/OpenTask/SessionBootstrapper.swift
    info:
      path: OpenTaskMac/Info.plist
      properties:
        CFBundleName: OpenTask
        CFBundleDisplayName: OpenTask
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ''
        # Local-loopback exception only (http://localhost), same as the iPhone
        # app: lets a dev server reached through an SSH tunnel load. Does NOT
        # weaken ATS for any remote host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: OpenTaskMac/OpenTaskMac.entitlements
      properties:
        # Sandboxed on purpose: an unsandboxed macOS app extension is a
        # plausible silent non-load, and a notification content extension may
        # follow. network.client is what lets a sandboxed app reach the server
        # at all — without it both WKWebView and URLSession fail.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        #
        # App Group, shared with OpenTaskMacWidgets so the widget extension's
        # timeline providers can read the same Keychain-stored credentials and
        # WidgetStore cache the app writes. macOS App Group IDs need the
        # team-ID prefix — unlike iOS's bare `group.io.mcnitt.opentask` — per
        # Apple's docs on `kSecAttrAccessGroup`. Confirmed working empirically
        # (2026-09-22): `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)`
        # resolves to a real, existing path and a `UserDefaults(suiteName:)`
        # round-trip succeeds, even though the embedded "Mac Team Provisioning
        # Profile" this team's automatic signing generates does not list
        # `com.apple.security.application-groups` when its Entitlements dict is
        # dumped directly (`security cms -D` on `embedded.provisionprofile`).
        # That dict is not the full picture for an auto-managed profile — trust
        # the runtime check (this one, or `codesign -d --entitlements -` on the
        # built app), not the profile's own entitlement listing.
        com.apple.security.application-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        #
        # `keychain-access-groups`, explicit and required alongside the App Group
        # above. Before `com.apple.security.application-groups` existed on this
        # App ID, automatic signing silently synthesized a wildcard
        # (`keychain-access-groups: [GEL3VGTUJX.*]`) into every build, which is
        # why sharing the Bearer token worked without this key ever being
        # written down. Requesting an explicit App Group made Xcode stop
        # synthesizing that wildcard — the signed binary quietly lost
        # `keychain-access-groups` entirely and every `SecItemAdd`/
        # `SecItemCopyMatching` call using `kSecAttrAccessGroup` started failing
        # with errSecMissingEntitlement (-34018), even though
        # `com.apple.security.application-groups` itself kept working fine
        # (confirmed via `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)`).
        # On iOS the App Group alone is sufficient for keychain access-group
        # matching; on macOS it is not — verified empirically (2026-09-22) by
        # adding this key back explicitly and watching the same seed-credential
        # save go from -34018 to success.
        # NOTE: bare key, no `com.apple.security.` prefix — matches what the
        # provisioning profile itself uses (verified via `security cms -D` on
        # the embedded profile before this was added).
        keychain-access-groups:
          - GEL3VGTUJX.group.io.mcnitt.opentask
        #
        # `aps-environment` is deliberately NOT here (see OpenTaskMac-Push.entitlements
        # for the push variant). Historical note: this used to be blocked on a
        # signed-out Apple ID and no macOS profile existing at all — both are
        # resolved now (automatic signing fetches a real "Mac Team Provisioning
        # Profile" for this App ID without issue as of 2026-09-22), but the
        # split is kept because XcodeGen still needs one entitlements file it
        # owns and one hand-written variant for CODE_SIGN_ENTITLEMENTS overrides.
        #
        #   xcodebuild ... CODE_SIGN_ENTITLEMENTS=OpenTaskMac/OpenTaskMac-Push.entitlements \
        #     -allowProvisioningUpdates
        #
        # Without it the app runs normally and APNs registration fails loudly
        # in the log (see MacAppDelegate.didFailToRegisterForRemoteNotifications).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mcnitt.opentask.mac
        INFOPLIST_KEY_NSHumanReadableCopyright: ''
