          type: integer
    get:
      summary: List recent webhook deliveries
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      description: Returns the last 50 delivery attempts for debugging.
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deliveries:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Tokens ---

  /api/tokens:
    get:
      summary: List API tokens
      operationId: listTokens
      tags: [Tokens]
      responses:
        '200':
          description: API tokens (previews only, not full tokens)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        token_preview:
                          type: string
                          description: Last 8 characters of the token
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create API token
      operationId: createToken
      tags: [Tokens]
      description: |
        Creates a new API token. The full token is returned in this response only.
        Tokens are stored as SHA-256 hashes — the raw token cannot be retrieved later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: API
      responses:
        '201':
          description: Created token (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      token:
                        type: string
                        description: Full token value (shown once)
                      created_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      summary: Revoke API token
      operationId: deleteToken
      tags: [Tokens]
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Auth ---

  /api/auth/session-from-token:
    post:
      summary: Exchange a Bearer token for a web session cookie
      operationId: createSessionFromToken
      tags: [Auth]
      description: |
        Mints a NextAuth session cookie for the owner of the supplied Bearer token and
        returns it in a `Set-Cookie` header. Used by the iOS app to log its WKWebView back
        in when the 7-day session JWT expires, using the long-lived token in its keychain.

        Bearer authentication only — a missing, malformed, or invalid `Authorization`
        header returns 401. This endpoint never falls back to session cookie or proxy
        header auth.

        The cookie is `HttpOnly`, `SameSite=Lax`, `Path=/`, expires in 7 days, and is named
        `__Secure-authjs.session-token` over HTTPS (`authjs.session-token` otherwise).
      responses:
        '200':
          description: Session cookie issued
          headers:
            Set-Cookie:
              description: NextAuth session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Stats ---

  /api/stats:
    get:
      summary: Get user statistics
      operationId: getStats
      tags: [Stats]
      parameters:
        - name: start
          in: query
          schema:
            type: string
            format: date
          description: Start date for daily stats range (YYYY-MM-DD)
        - name: end
          in: query
          schema:
            type: string
            format: date
          description: End date for daily stats range (YYYY-MM-DD)
      responses:
        '200':
          description: Stats summary or daily stats for date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StatsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Completions ---

  /api/completions:
    get:
      summary: Query completion history
      operationId: listCompletions
      tags: [Stats]
      parameters:
        - name: task_id
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by completion date (YYYY-MM-DD, UTC calendar date)
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Filter to completions at or after this instant. Must be paired with `until`.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Filter to completions before this instant. Must be paired with `since`.
      responses:
        '200':
          description: Completion records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token created via POST /api/tokens or the db:create-token CLI command

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PromptActionResult:
      description: What the prompt action did, and the quotas it touched
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  considered:
                    type: integer
                  did:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  schemas:
    PromptKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            example: 'q:42:0:2026-09-24'

    PromptAction:
      type: object
      required: [key]
      properties:
        key:
          type: string
          example: 'q:42:2:2026-09-24'
        did:
          type: boolean
          default: false
          description: true = did it (log progress + consider); false = consider only.

    QuotaPrompt:
      type: object
      description: |
        One quota prompt (quota reminders, 2026-09-24): an unmet quota shown in
        a reminder period. Not a task — key rows by `prompt_key`, act on it with
        the quota-prompt endpoints; `task_id` is the quota (for opening it).
      properties:
        prompt_key:
          type: string
          description: >
            `q:<taskId>:<k>:<date>` — k is the prompt's number for a daily quota
            (the highest number assigned to this slot), 0 otherwise; date is the
            user's local date.
          example: 'q:42:0:2026-09-24'
        task_id:
          type: integer
        number:
          type: integer
          nullable: true
          description: >
            Daily quotas: the row is done once today's count reaches this.
            Null for every other quota (one prompt a day).
        numbers:
          type: array
          nullable: true
          items:
            type: integer
          description: >
            Daily quotas: every prompt number this row stands for, ascending
            (`number` is the last). Moving the row to another period means
            setting `quota_prompt_config.numbers[k]` for exactly these. Null for
            every other quota — move those with `quota_prompt_config.slot_id`.
        slot_id:
          type: integer
          nullable: true
          description: The period (time slot id) this row sits in; null in the un-slotted group.
        title:
          type: string
        current:
          type: integer
          description: Today's count (0 once the period ended, even before the rollover job runs).
        target:
          type: integer
        period:
          type: string
          nullable: true
          enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
        stripe_color:
          type: string
          nullable: true
          enum: [red, orange, yellow, blue, purple, pink, gray]
          description: >
            The quota's label colour for its stripe, resolved server-side. Null
            is neutral (no label or colour); green is never sent — it means
            "met" on quota chips.
        has_notes:
          type: boolean
          description: >
            The quota has non-blank notes. A flag only, for the rows' notes
            mark; the notes themselves are on the quota task.
        considered:
          type: boolean
        done:
          type: boolean
          description: >
            Daily: today's count reached `number`. Others: progress was logged
            today from anywhere (or "did it" on this prompt).

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        details:
          type: object

    Task:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        original_title:
          type: string
          nullable: true
          description: Raw input text before AI enrichment
        short_title:
          type: string
          nullable: true
          maxLength: 24
          description: >
            Optional short label for the quota widget chip (§5). Only
            meaningful on a quota (progress_target > 1 or is_tracked), but not
            rejected on an ordinary task.
            Kept for API compatibility; the web editor no longer sets it, and
            clients fall back to `title` when it is null.
        done:
          type: boolean
        done_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 4
          description: '0=unset, 1=low, 2=medium, 3=high, 4=urgent'
        due_at:
          type: string
          format: date-time
          nullable: true
        rrule:
          type: string
          nullable: true
          description: RFC 5545 recurrence rule
        recurrence_mode:
          type: string
          enum: [from_due, from_completion]
        anchor_time:
          type: string
          nullable: true
        anchor_dow:
          type: integer
          nullable: true
        anchor_dom:
          type: integer
          nullable: true
        original_due_at:
          type: string
          format: date-time
          nullable: true
        auto_snooze_minutes:
          type: integer
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        labels:
          type: array
          items:
            type: string
        notes:
          type: string
          nullable: true
        progress_target:
          type: integer
          description: >
            Track / quota target (REDESIGN-V03 §5). 1 means the task is not
            tracked - every task is already a quota with target 1, so tracking
            is opt-in simply by setting this above 1.
        progress_current:
          type: integer
          description: >
            How many increments are logged this period. Reaching the target
            marks the task "met" but does NOT complete it; the task stays open
            until its period boundary, so overflow (3/2) remains observable.
        progress_period_start:
          type: string
          format: date-time
          nullable: true
          description: >
            A quota's period anchor (§5) - the UTC instant the current period
            began, by the user's local calendar (Monday 00:00 for a week, the
            1st for a month). Null until the period-rollover job first runs for
            the quota, and null on anything that is not a quota. USE THIS, NOT
            due_at, for anything that needs to know how far through its period a
            quota is (a pace indicator, for example): a quota has no due_at.
        quota_prompt_config:
          type: object
          nullable: true
          description: >
            Quota reminders (2026-09-24): whether and where this quota prompts
            on the Reminders surface. Null = the defaults (on for daily, weekly
            and monthly quotas; off for yearly and period-less; in the user's
            default period). Writable on create and PATCH; `null` resets it.
            Slot ids are resolved when read — a deleted period falls back to the
            user's default, then the first period of the day. A write that names
            a slot id the stored config does not already name must name one of
            the quota owner's own periods (400 otherwise).
          properties:
            enabled:
              type: boolean
            slot_id:
              type: integer
              nullable: true
            numbers:
              type: object
              description: Daily quotas — the period for prompt number k, keyed "1".."N".
              additionalProperties:
                type: integer
                nullable: true
        quota_day_state:
          type: object
          nullable: true
          readOnly: true
          description: >
            Server-owned record of the owner's local day for this quota's
            prompts; restored by undo. A date other than today means nothing
            happened today.
          properties:
            date:
              type: string
              example: '2026-09-24'
            logged:
              type: integer
            did:
              type: array
              items:
                type: string
            considered:
              type: array
              items:
                type: string
            did_applied:
              type: object
              additionalProperties:
                type: integer
              description: >
                What each key in `did` added to the count — what putting that
                prompt back takes away. A key with no entry (a did-it from
                before 2026-09-25) reads as 1 for a once-a-day prompt and 0
                for a daily numbered one.
        completion_count:
          type: integer
        snooze_count:
          type: integer
        skip_count:
          type: integer
          description: >
            Occurrences declined without a completion (§7.5). Exists so
            completion_count stays honest - nothing may infer intent from it.
        first_completed_at:
          type: string
          format: date-time
          nullable: true
        last_completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_recurring:
          type: boolean
          description: Computed field — true if rrule is set
        is_snoozed:
          type: boolean
          description: |
            Computed field — true when the due date has moved off its
            occurrence origin (`original_due_at` set and different from
            `due_at`). A freshly dated task, or one given an explicit new date
            with `reset_original_due_at`, is not snoozed.

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        short_title:
          type: string
          nullable: true
          maxLength: 24
          description: >
            Optional short label for the quota widget chip (§5). Trimmed;
            empty string is stored as null.
            Kept for API compatibility; the web editor no longer sets it, and
            clients fall back to `title` when it is null.
        due_at:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 0
          maximum: 4
          default: 0
        rrule:
          type: string
          description: RFC 5545 recurrence rule
        recurrence_mode:
          type: string
          enum: [from_due, from_completion]
          default: from_due
        labels:
          type: array
          items:
            type: string
        notes:
          type: string
        project_id:
          type: integer
          description: Defaults to user's Inbox project
        auto_snooze_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        progress_target:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: >
            Set above 1 to track this task as a quota (§5). That is the entire
            opt-in gesture; there is no separate flag.
        create_label:
          type: boolean
          description: >
            Register any labels in this write that aren't already in the
            registry (§7.2). Without it, an unknown label is a 400 - creating a
            label is a discrete act, so a typo fails loudly.
        ai_proposed:
          type: boolean
          description: >
            Apply the `ai-proposed` provenance label. Exists so automated
            callers never type a behavior-bearing label as free text.
        ai_added:
          type: boolean
          description: Apply the `ai-added` provenance label.
        enrich:
          type: boolean
          description: >
            Ask for AI enrichment even though this request supplies structured
            fields. Enrichment is normally triggered only by title-only input;
            the Reminders quick add sets this because it always sends a default
            schedule so the new reminder appears in a time slot immediately.
            Ignored when AI is disabled.

    Label:
      type: object
      description: A registered label (§7.2).
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        facet:
          type: string
          enum: [domain, operational]
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TimeSlot:
      type: object
      description: A life-moment container (§6.0).
      properties:
        id:
          type: integer
        user_id:
          type: integer
        label:
          type: string
          example: Early morning
        start_time:
          type: string
          example: '07:00'
          description: HH:MM, 24-hour, local
        sort_order:
          type: integer
          description: Vestigial - every reader orders slots by start_time.
        created_at:
          type: string
          format: date-time

    TimeSlotChange:
      type: object
      description: Result of PATCH/DELETE /api/time-slots/{id}.
      properties:
        slot:
          $ref: '#/components/schemas/TimeSlot'
        reminders_moved:
          type: integer
          description: Reminders rewritten to stay in (or find) a slot.
        undo_id:
          type: integer
          nullable: true
          description: The undo_log entry for this change (POST /api/undo/batch with through_id undoes exactly it); null for a rename.

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        short_title:
          type: string
          nullable: true
          maxLength: 24
          description: >
            Optional short label for the quota widget chip (§5). Trimmed;
            empty string is stored as null.
            Kept for API compatibility; the web editor no longer sets it, and
            clients fall back to `title` when it is null.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: |
            On its own, moving an existing date is a **snooze**: the
            occurrence origin (`original_due_at`) is kept, `snooze_count`
            increments, and the task reads as snoozed. Send
            `reset_original_due_at: true` with it for an **explicit
            reschedule** instead (what the date picker does): the new date
            becomes the origin, `snooze_count` resets, and it is not a snooze.

            A snooze of a dated reminder is refused (400) — reminders are not
            snoozed; an explicit reschedule is allowed. Sent together with
            `rrule`, the date is honored and the rule's anchors are derived
            from it (a re-schedule, never a snooze). A quota has no due date.
        reset_original_due_at:
          type: boolean
          description: |
            Make the occurrence origin the task's due date — the NEW `due_at`
            when one is sent in the same request — and reset `snooze_count` to
            0. Undo restores the previous values.
        priority:
          type: integer
          minimum: 0
          maximum: 4
        rrule:
          type: string
          nullable: true
        recurrence_mode:
          type: string
          enum: [from_due, from_completion]
        labels:
          type: array
          items:
            type: string
        notes:
          type: string
          nullable: true
        project_id:
          type: integer
        auto_snooze_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        progress_target:
          type: integer
          minimum: 1
          maximum: 1000
        progress_current:
          type: integer
          minimum: 0
        create_label:
          type: boolean
          description: Register unknown labels in this write instead of rejecting them (§7.2).
          nullable: true

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        owner_id:
          type: integer
        shared:
          type: boolean
        sort_order:
          type: integer
        color:
          type: string
          enum: [red, orange, yellow, green, blue, purple, pink, gray]
          nullable: true
        active_count:
          type: integer
        overdue_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Completion:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        completed_at:
          type: string
          format: date-time
        due_at_was:
          type: string
          format: date-time
          nullable: true
        due_at_next:
          type: string
          format: date-time
          nullable: true
        task_title:
          type: string
        project_id:
          type: integer
        is_reminder:
          type: boolean
        is_tracked:
          type: boolean
        progress_target:
          type: integer

    Webhook:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        url:
          type: string
          format: uri
        secret:
          type: string
          description: HMAC-SHA256 signing secret (only returned on creation)
        events:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.updated
              - task.completed
              - task.deleted
              - task.snoozed
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookPublic:
      type: object
      description: Webhook without the secret field
      properties:
        id:
          type: integer
        user_id:
          type: integer
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - task.created
              - task.updated
              - task.completed
              - task.deleted
              - task.snoozed
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - task.created
              - task.updated
              - task.completed
              - task.deleted
              - task.snoozed

    WebhookUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - task.created
              - task.updated
              - task.completed
              - task.deleted
              - task.snoozed
        active:
          type: boolean

    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        webhook_id:
          type: integer
        event:
          type: string
        payload:
          type: string
          description: JSON string of the delivered payload
        status_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        attempt:
          type: integer
        created_at:
          type: string
          format: date-time

    UndoResult:
      type: object
      properties:
        undone_action:
          type: string
        description:
          type: string
          nullable: true
        tasks_affected:
          type: integer

    BulkResult:
      type: object
      properties:
        tasks_affected:
          type: integer
          description: Number of tasks that were modified
        tasks_skipped:
          type: integer
          description: Number of tasks in the request that were not modified
        skipped_urgent:
          type: integer
          description: |
            Skipped on priority — High AND Urgent together. The name is kept for
            client compatibility (the iOS app reads it).
        skipped_high:
          type: integer
          description: |
            The High (P3) subset of `skipped_urgent`. Urgent alone is the
            difference between the two.
        snoozed_high:
          type: integer
          description: |
            How many of the tasks actually moved were High (P3). Equal to
            `tasks_affected` on the second press of a double snooze, when only
            High tasks were left to sweep.
        skipped_reminders:
          type: integer
          description: Reminders skipped — they are bucket-locked and never snoozed
        skipped_no_due_date:
          type: integer
          description: Relative mode only — tasks with no due_at to add the delta to

    StatsSummary:
      type: object
      properties:
        today:
          type: object
          nullable: true
          properties:
            completions:
              type: integer
            tasks_created:
              type: integer
            snoozes:
              type: integer
        week:
          type: object
          properties:
            completions:
              type: integer
            tasks_created:
              type: integer
            snoozes:
              type: integer
        month:
          type: object
          properties:
            completions:
              type: integer
            tasks_created:
              type: integer
            snoozes:
              type: integer
        all_time:
          type: object
          properties:
            completions:
              type: integer
            tasks_created:
              type: integer
            snoozes:
              type: integer
