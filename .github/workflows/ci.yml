name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Native-only PRs (every changed file under ios/ or macos/) skip the web jobs.
  # The web jobs are required status checks on main; GitHub treats a job skipped
  # by its `if:` as passing, so the PR stays mergeable. Pushes to main always run.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(ios|macos)/'; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  # E2E runs against a production build, made in this job by
  # playwright.config.ts's webServer (`npm run build && next start`), with the
  # same `.next/cache` the Build job restores so the build is incremental.
  # Building here rather than downloading the Build job's output keeps E2E off
  # Build's critical path: the build is ~40 s, about what an artifact
  # upload + download of `.next` would cost, and this way E2E starts at once.
  #
  # It needs only `changes`, not `quality`: E2E is the long pole, and waiting
  # ~80 s for lint first bought nothing but a later result.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Not cached: this step is ~13 s, almost all of it `apt-get update`, which
      # a cache of the .deb files can't skip (the runner image already carries
      # Chrome's libraries, so little is actually downloaded).
      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # Flaky tests fail the run (`failOnFlakyTests` in playwright.config.ts);
      # this names them, and the rest of the tally, on the run's summary page.
      - name: E2E summary
        if: always()
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const file = 'test-results/e2e.json'
          if (!fs.existsSync(file)) {
            console.log('### E2E\n\nNo report: the run stopped before any test ran.')
            process.exit(0)
          }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'))
          const { expected, unexpected, flaky, skipped, duration } = report.stats
          const byOutcome = { unexpected: [], flaky: [] }
          const walk = (suite, path) => {
            for (const spec of suite.specs ?? []) {
              for (const t of spec.tests) {
                if (byOutcome[t.status]) byOutcome[t.status].push(`${spec.file}:${spec.line} ${[...path, spec.title].join(' › ')}`)
              }
            }
            for (const child of suite.suites ?? []) walk(child, [...path, child.title])
          }
          for (const s of report.suites) walk(s, [])
          console.log('### E2E')
          console.log('')
          console.log(`${expected} passed · ${unexpected} failed · **${flaky} flaky (counted as failures)** · ${skipped} skipped · ${Math.round(duration / 1000)} s`)
          for (const [label, list] of [['Failed', byOutcome.unexpected], ['Flaky: passed only on retry', byOutcome.flaky]]) {
            if (list.length === 0) continue
            console.log(`\n**${label}**\n`)
            for (const line of list) console.log(`- ${line}`)
          }
          EOF
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
